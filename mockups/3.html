<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3 · Título a la izquierda</title>
<style>
@font-face { font-family: Playfair; src: url("fonts/Playfair.ttf") format("truetype"); font-weight: 400 700; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100vh; min-height: 100svh;
  background: #000 url("danza.jpg") center 38% / cover no-repeat;
  color: #fff; font-family: system-ui, sans-serif;
}
.velo {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column;
  background: linear-gradient(90deg, rgb(0 0 0 / .82) 0%, rgb(0 0 0 / .62) 34%, rgb(0 0 0 / .18) 62%, rgb(0 0 0 / .05) 100%);
}
header {
  position: relative;
  display: flex; align-items: center; gap: 22px;
  padding: 18px 28px 0;
}
.marca img { width: 46px; height: 46px; mix-blend-mode: lighten; display: block; }
nav {
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px 18px;
  margin-left: auto;
  font-size: 12px; font-weight: 650; letter-spacing: .08em;
}
nav a { color: #fff; text-decoration: none; white-space: nowrap; text-transform: uppercase; }
nav .oro { color: #e2b340; }
nav .vivo { display: inline-flex; align-items: center; gap: 7px; }
nav .vivo::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: #e23b3b;
  box-shadow: 0 0 0 4px rgb(226 59 59 / .25);
}
.burger {
  display: none; margin-left: auto; width: 44px; height: 44px;
  border: 1px solid rgb(255 255 255 / .35); border-radius: 10px;
  background: transparent; color: #fff;
}
main { flex: 1; display: flex; align-items: center; padding: 24px 72px 64px; }
h1 {
  margin: 0; max-width: 12ch;
  font-family: Playfair, Georgia, serif; font-weight: 600; font-size: clamp(34px, 4.2vw, 58px);
  line-height: 1.12; color: #e2b340;
}
p { max-width: 38ch; margin: 16px 0 26px; font-size: 17px; line-height: 1.45; }
.btn {
  background: #e2b340; color: #1c1406; text-decoration: none; font-weight: 700;
  padding: 12px 22px; border-radius: 4px;
}
@media (max-width: 900px) {
  .velo { background: linear-gradient(180deg, rgb(0 0 0 / .55) 0%, rgb(0 0 0 / .15) 38%, rgb(0 0 0 / .82) 100%); }
  header { padding: 14px 16px 0; }
  .burger { display: grid; place-items: center; }
  nav {
    display: none; position: absolute; z-index: 2; top: 68px; left: 12px; right: 12px;
    margin: 0; padding: 8px; flex-direction: column; align-items: stretch; gap: 0;
    background: rgb(12 8 7 / .92); border: 1px solid rgb(255 255 255 / .14); border-radius: 14px;
    font-size: 15px; letter-spacing: .06em;
  }
  nav a { padding: 12px 14px; border-bottom: 1px solid rgb(255 255 255 / .08); }
  nav a:last-child { border-bottom: 0; }
  body.abierto nav { display: flex; }
  main { align-items: flex-end; padding: 24px 20px 36px; }
  h1 { max-width: 14ch; }
}
</style>
</head>
<body>
<div class="velo">
  <header>
    <a class="marca" href="#" aria-label="Inicio"><img src="monograma.webp" alt="" /></a>
    <button class="burger" aria-label="Abrir menú">
      <svg width="20" height="14" viewBox="0 0 20 14" fill="none" aria-hidden="true"><path d="M1 1.5h18M1 7h18M1 12.5h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Historia</a>
      <a href="#">Mayordomía</a>
      <a href="#">La cuadrilla</a>
      <a href="#">Actividades</a>
      <a href="#">Catálogo</a>
      <a href="#">Sorteos</a>
      <a class="oro" href="#">Crear invitación</a>
      <a class="vivo" href="#">En vivo</a>
    </nav>
  </header>
  <script>if (location.search.includes("menu")) document.body.classList.add("abierto")</script>
  <main>
    <div>
      <h1>Fe, Historia y Tradición que Danzan</h1>
      <p>Descubre la magia de Los Negritos de Huánuco, en la Cofradía de Negritos “Niño Jesús de Paucarbambilla”</p>
      <a class="btn" href="#">Explora la Historia</a>
    </div>
  </main>
</div>
</body>
</html>
